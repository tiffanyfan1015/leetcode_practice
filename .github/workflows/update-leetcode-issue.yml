name: Update LeetCode Issue

on:
  workflow_dispatch:
    inputs:
      source_issue_number:
        description: "Source repo issue number"
        required: true
        type: string
      slug:
        description: "Problem slug, for example two-sum"
        required: true
        type: string
      difficulty:
        description: "easy / medium / hard"
        required: true
        type: choice
        options:
          - easy
          - medium
          - hard
      topics:
        description: "Comma-separated topics, for example array,hash-table"
        required: false
        type: string
      solution_path:
        description: "Solution file path, for example problems/two-sum/solution.py"
        required: true
        type: string
      notes_path:
        description: "Notes file path, for example problems/two-sum/README.md"
        required: true
        type: string
      summary:
        description: "Short comment summary"
        required: false
        type: string
      mark_as_solved:
        description: "Mark as solved and close the issue"
        required: true
        type: boolean

permissions:
  issues: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update target issue
        uses: actions/github-script@v7
        env:
          INPUT_SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_DIFFICULTY: ${{ inputs.difficulty }}
          INPUT_TOPICS: ${{ inputs.topics }}
          INPUT_SOLUTION_PATH: ${{ inputs.solution_path }}
          INPUT_NOTES_PATH: ${{ inputs.notes_path }}
          INPUT_SUMMARY: ${{ inputs.summary }}
          INPUT_MARK_AS_SOLVED: ${{ inputs.mark_as_solved }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'leetcode.config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

            const targetOwner = config.target.owner;
            const targetRepo = config.target.repo;
            const statusTodo = config.labels.statusTodo;
            const statusSolving = config.labels.statusSolving;
            const statusSolved = config.labels.statusSolved;
            const difficultyPrefix = config.labels.difficultyPrefix;
            const topicPrefix = config.labels.topicPrefix;

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                per_page: 100
              }
            );
            const availableLabels = new Set(
              repoLabels.map(label => String(label.name || '').trim()).filter(Boolean)
            );

            const sourceIssueNumber = Number(process.env.INPUT_SOURCE_ISSUE_NUMBER);
            const slug = process.env.INPUT_SLUG;
            const difficulty = String(process.env.INPUT_DIFFICULTY || '').trim().toLowerCase();
            const topicsRaw = String(process.env.INPUT_TOPICS || '');
            const solutionPath = process.env.INPUT_SOLUTION_PATH;
            const notesPath = process.env.INPUT_NOTES_PATH;
            const summary = String(process.env.INPUT_SUMMARY || '').trim();
            const markAsSolved = String(process.env.INPUT_MARK_AS_SOLVED).toLowerCase() === 'true';

            if (!sourceIssueNumber) {
              core.setFailed('source_issue_number is invalid');
              return;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                state: 'all',
                per_page: 100
              }
            );

            const targetIssue = issues.find(issue => {
              const body = issue.body || '';
              return body.includes(`<!-- source_issue: ${sourceIssueNumber} -->`);
            });

            if (!targetIssue) {
              core.setFailed(`Cannot find synced target issue for source issue #${sourceIssueNumber}`);
              return;
            }

            const topics = topicsRaw
              .split(',')
              .map(s => s.trim().toLowerCase())
              .filter(Boolean);

            const desiredLabels = new Set();
            const statusLabel = markAsSolved ? statusSolved : statusSolving;
            if (availableLabels.has(statusLabel)) {
              desiredLabels.add(statusLabel);
            } else {
              core.info(`Skip missing label: ${statusLabel}`);
            }

            const difficultyLabel = `${difficultyPrefix}${difficulty}`;
            if (availableLabels.has(difficultyLabel)) {
              desiredLabels.add(difficultyLabel);
            } else {
              core.info(`Skip missing label: ${difficultyLabel}`);
            }

            for (const topic of topics) {
              const topicLabel = `${topicPrefix}${topic}`;
              if (availableLabels.has(topicLabel)) {
                desiredLabels.add(topicLabel);
              } else {
                core.info(`Skip missing label: ${topicLabel}`);
              }
            }

            const existingLabels = (targetIssue.labels || []).map(label =>
              typeof label === 'string' ? label : label.name
            );

            const filteredExisting = existingLabels.filter(name => {
              if (!name) return false;
              if (name === statusTodo || name === statusSolving || name === statusSolved) return false;
              if (difficultyPrefix && name.startsWith(difficultyPrefix)) return false;
              if (topicPrefix && name.startsWith(topicPrefix)) return false;
              if (!difficultyPrefix && ['easy', 'medium', 'hard'].includes(name)) return false;
              if (!topicPrefix && topics.includes(name)) return false;
              return true;
            });

            const finalLabels = [...new Set([...filteredExisting, ...desiredLabels])];

            const commentLines = [
              'Updated solution record.',
              '',
              `- Slug: \`${slug}\``,
              `- Solution: \`${solutionPath}\``,
              `- Notes: \`${notesPath}\``,
              `- Difficulty: \`${difficulty}\``
            ];

            if (topics.length > 0) {
              commentLines.push(`- Topics: ${topics.map(t => `\`${t}\``).join(', ')}`);
            }

            if (summary) {
              commentLines.push('', 'Summary:', summary);
            }

            await github.rest.issues.createComment({
              owner: targetOwner,
              repo: targetRepo,
              issue_number: targetIssue.number,
              body: commentLines.join('\n')
            });

            await github.rest.issues.setLabels({
              owner: targetOwner,
              repo: targetRepo,
              issue_number: targetIssue.number,
              labels: finalLabels
            });

            if (markAsSolved) {
              await github.rest.issues.update({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: targetIssue.number,
                state: 'closed'
              });
            }

            core.info(`Updated target issue #${targetIssue.number}`);
