name: Update LeetCode Issue

on:
  workflow_dispatch:
    inputs:
      source_issue_number:
        description: "Source repo issue number"
        required: true
        type: string
      slug:
        description: "Problem slug, for example two-sum"
        required: true
        type: string
      mark_as_solved:
        description: "Mark as solved and close the issue"
        required: true
        type: boolean

permissions:
  issues: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update target issue
        uses: actions/github-script@v7
        env:
          INPUT_SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_MARK_AS_SOLVED: ${{ inputs.mark_as_solved }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'leetcode.config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

            const targetOwner = config.target.owner;
            const targetRepo = config.target.repo;
            const statusTodo = config.labels.statusTodo;
            const statusSolving = config.labels.statusSolving;
            const statusSolved = config.labels.statusSolved;

            function normalizeLabelName(value) {
              return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[_\s]+/g, '-');
            }

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                per_page: 100
              }
            );
            const availableLabels = new Map();
            for (const label of repoLabels) {
              const actualName = String(label.name || '').trim();
              const normalizedName = normalizeLabelName(actualName);
              if (actualName && normalizedName && !availableLabels.has(normalizedName)) {
                availableLabels.set(normalizedName, actualName);
              }
            }

            const sourceIssueNumber = Number(process.env.INPUT_SOURCE_ISSUE_NUMBER);
            const slug = process.env.INPUT_SLUG;
            const solutionPath = `problems/${slug}/solution.cpp`;
            const notesPath = `problems/${slug}/README.md`;
            const markAsSolved = String(process.env.INPUT_MARK_AS_SOLVED).toLowerCase() === 'true';

            if (!sourceIssueNumber) {
              core.setFailed('source_issue_number is invalid');
              return;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                state: 'all',
                per_page: 100
              }
            );

            const targetIssue = issues.find(issue => {
              const body = issue.body || '';
              return body.includes(`<!-- source_issue: ${sourceIssueNumber} -->`);
            });

            if (!targetIssue) {
              core.setFailed(`Cannot find synced target issue for source issue #${sourceIssueNumber}`);
              return;
            }

            const desiredLabels = new Set();
            const statusLabel = markAsSolved ? statusSolved : statusSolving;
            const resolvedStatusLabel = availableLabels.get(normalizeLabelName(statusLabel));
            if (resolvedStatusLabel) {
              desiredLabels.add(resolvedStatusLabel);
            } else {
              core.info(`Skip missing label: ${statusLabel}`);
            }

            const existingLabels = (targetIssue.labels || []).map(label =>
              typeof label === 'string' ? label : label.name
            );

            const filteredExisting = existingLabels.filter(name => {
              if (!name) return false;
              const normalized = normalizeLabelName(name);
              if (normalized === normalizeLabelName(statusTodo)) return false;
              if (normalized === normalizeLabelName(statusSolving)) return false;
              if (normalized === normalizeLabelName(statusSolved)) return false;
              return true;
            });

            const finalLabels = [...new Set([...filteredExisting, ...desiredLabels])];

            const commentLines = [
              'Updated solution record.',
              '',
              `- Slug: \`${slug}\``,
              `- Solution: \`${solutionPath}\``,
              `- Notes: \`${notesPath}\``
            ];

            await github.rest.issues.createComment({
              owner: targetOwner,
              repo: targetRepo,
              issue_number: targetIssue.number,
              body: commentLines.join('\n')
            });

            await github.rest.issues.setLabels({
              owner: targetOwner,
              repo: targetRepo,
              issue_number: targetIssue.number,
              labels: finalLabels
            });

            if (markAsSolved) {
              await github.rest.issues.update({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: targetIssue.number,
                state: 'closed'
              });
            }

            core.info(`Updated target issue #${targetIssue.number}`);
