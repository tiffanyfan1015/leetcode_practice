name: Backfill LeetCode Issues

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backfill synced issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'leetcode.config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

            const sourceOwner = config.source.owner;
            const sourceRepo = config.source.repo;
            const targetOwner = config.target.owner;
            const targetRepo = config.target.repo;
            const statusTodo = config.labels.statusTodo;
            const statusSolving = config.labels.statusSolving;
            const statusSolved = config.labels.statusSolved;

            function normalizeLabelName(value) {
              return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[_\s]+/g, '-');
            }

            function extractMetaFromBody(bodyText) {
              const body = String(bodyText || '');
              const lines = body.split(/\r?\n/);
              let difficulty = null;
              let topics = [];

              for (const rawLine of lines) {
                const line = rawLine
                  .replace(/^\s*[-*>\d.)]+\s*/, '')
                  .replace(/\*\*/g, '')
                  .trim();

                const difficultyMatch = line.match(/(?:^|\s)(?:難度|Difficulty)\s*[:：]\s*(.+)$/i);
                if (!difficulty && difficultyMatch) {
                  difficulty = difficultyMatch[1].trim().toLowerCase();
                }

                const topicsMatch = line.match(/(?:^|\s)(?:主題|Topics?)\s*[:：]\s*(.+)$/i);
                if (topics.length === 0 && topicsMatch) {
                  topics = topicsMatch[1]
                    .split(/[\/、,，]/)
                    .map(s => s.trim().toLowerCase())
                    .filter(Boolean)
                    .map(s => s.replace(/[_\s]+/g, '-'));
                }
              }

              return { difficulty, topics };
            }

            function buildSyncedBody(sourceIssue) {
              const originalBody = String(sourceIssue.body || '').trim();
              return [
                `Source Issue: ${sourceIssue.html_url}`,
                '',
                `Original title: ${sourceIssue.title}`,
                '',
                '## Original issue content',
                '',
                originalBody || '_No content_',
                '',
                `<!-- source_repo: ${sourceOwner}/${sourceRepo} -->`,
                `<!-- source_issue: ${sourceIssue.number} -->`
              ].join('\n');
            }

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                per_page: 100
              }
            );

            const availableLabels = new Map();
            for (const label of repoLabels) {
              const actualName = String(label.name || '').trim();
              const normalizedName = normalizeLabelName(actualName);
              if (actualName && normalizedName && !availableLabels.has(normalizedName)) {
                availableLabels.set(normalizedName, actualName);
              }
            }

            const targetIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                state: 'all',
                per_page: 100
              }
            );

            const syncedIssues = targetIssues.filter(issue => {
              const body = String(issue.body || '');
              return body.includes(`<!-- source_repo: ${sourceOwner}/${sourceRepo} -->`);
            });

            core.info(`Found ${syncedIssues.length} synced issue(s) to backfill.`);

            let updatedCount = 0;

            for (const issue of syncedIssues) {
              const body = String(issue.body || '');
              const match = body.match(/<!--\s*source_issue:\s*(\d+)\s*-->/);
              if (!match) {
                core.info(`Skip target issue #${issue.number}: no source_issue marker`);
                continue;
              }

              const sourceIssueNumber = Number(match[1]);
              const sourceIssue = await github.rest.issues.get({
                owner: sourceOwner,
                repo: sourceRepo,
                issue_number: sourceIssueNumber
              });

              const sourceData = sourceIssue.data;
              const meta = extractMetaFromBody(sourceData.body || '');
              core.info(`Parsed source #${sourceIssueNumber}: difficulty=${meta.difficulty || 'N/A'}, topics=${meta.topics.join(', ') || 'N/A'}`);
              const nextBody = buildSyncedBody(sourceData);

              const existingLabels = (issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              ).filter(Boolean);

              const statusLabels = [statusTodo, statusSolving, statusSolved].map(normalizeLabelName);
              const keptLabels = existingLabels.filter(name => {
                const normalized = normalizeLabelName(name);
                if (['easy', 'medium', 'hard'].includes(normalized)) return false;
                if (statusLabels.includes(normalized)) return true;
                return true;
              });

              const labels = [...keptLabels];

              if (meta.difficulty) {
                const difficultyLabel = availableLabels.get(normalizeLabelName(meta.difficulty));
                if (difficultyLabel) {
                  if (!labels.some(name => normalizeLabelName(name) === normalizeLabelName(difficultyLabel))) {
                    labels.push(difficultyLabel);
                  }
                } else {
                  core.info(`Skip missing label: ${meta.difficulty}`);
                }
              }

              for (const topic of meta.topics) {
                const topicLabel = availableLabels.get(normalizeLabelName(topic));
                if (topicLabel) {
                  if (!labels.some(name => normalizeLabelName(name) === normalizeLabelName(topicLabel))) {
                    labels.push(topicLabel);
                  }
                } else {
                  core.info(`Skip missing label: ${topic}`);
                }
              }

              core.info(`Apply labels to target #${issue.number}: ${labels.join(', ') || 'N/A'}`);

              await github.rest.issues.update({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: issue.number,
                body: nextBody
              });

              await github.rest.issues.setLabels({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: issue.number,
                labels
              });

              updatedCount += 1;
              core.info(`Backfilled target issue #${issue.number} from source #${sourceIssueNumber}`);
            }

            core.info(`Done. Updated ${updatedCount} issue(s).`);
