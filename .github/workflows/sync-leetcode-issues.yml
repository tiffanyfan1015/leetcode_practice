name: Sync LeetCode Issues

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'leetcode.config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

            const sourceOwner = config.source.owner;
            const sourceRepo = config.source.repo;
            const keyword = String(config.source.titleKeyword || 'leetcode').toLowerCase();
            const requiredLabel = String(config.source.requiredLabel || 'daily').toLowerCase();
            const createdFrom = String(config.source.createdFrom || '2026-08-06');
            const targetOwner = config.target.owner;
            const targetRepo = config.target.repo;
            const statusTodo = config.labels.statusTodo;

            const createdFromDate = new Date(`${createdFrom}T00:00:00Z`);
            if (Number.isNaN(createdFromDate.getTime())) {
              core.setFailed('leetcode.config.json source.createdFrom must be YYYY-MM-DD');
              return;
            }

            if (!targetOwner || targetOwner === 'YOUR_GITHUB_OWNER') {
              core.setFailed('leetcode.config.json target.owner is not set');
              return;
            }

            if (!targetRepo || targetRepo === 'YOUR_REPO_NAME') {
              core.setFailed('leetcode.config.json target.repo is not set');
              return;
            }

            function normalizeLabelName(value) {
              return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[_\s]+/g, '-');
            }

            function extractMetaFromBody(bodyText) {
              const body = String(bodyText || '');
              const difficultyMatch = body.match(/^\u96e3\u5ea6\uff1a\s*(.+)$/m);
              const topicsMatch = body.match(/^\u4e3b\u984c\uff1a\s*(.+)$/m);

              const difficulty = difficultyMatch
                ? difficultyMatch[1].trim().toLowerCase()
                : null;

              const topics = topicsMatch
                ? topicsMatch[1]
                    .split('/')
                    .map(s => s.trim().toLowerCase())
                    .filter(Boolean)
                    .map(s => s.replace(/[_\s]+/g, '-'))
                : [];

              return { difficulty, topics };
            }

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                per_page: 100
              }
            );

            const availableLabels = new Map();
            for (const label of repoLabels) {
              const actualName = String(label.name || '').trim();
              const normalizedName = normalizeLabelName(actualName);
              if (actualName && normalizedName && !availableLabels.has(normalizedName)) {
                availableLabels.set(normalizedName, actualName);
              }
            }

            const sourceIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: sourceOwner,
                repo: sourceRepo,
                state: 'open',
                per_page: 100
              }
            );

            const matched = sourceIssues.filter(issue => {
              if (issue.pull_request) return false;

              const titleMatched = String(issue.title || '').toLowerCase().includes(keyword);
              const labelNames = (issue.labels || []).map(label =>
                typeof label === 'string' ? label.toLowerCase() : String(label.name || '').toLowerCase()
              );
              const hasRequiredLabel = labelNames.includes(requiredLabel);

              const createdAt = new Date(issue.created_at);
              const createdMatched = !Number.isNaN(createdAt.getTime()) && createdAt >= createdFromDate;

              return titleMatched && hasRequiredLabel && createdMatched;
            });

            core.info(`Matched source issues: ${matched.length}`);

            const targetIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: targetOwner,
                repo: targetRepo,
                state: 'all',
                per_page: 100
              }
            );

            const existingMarkers = new Set();
            for (const issue of targetIssues) {
              const body = issue.body || '';
              const markerMatch = body.match(/<!--\s*source_issue:\s*(\d+)\s*-->/);
              if (markerMatch) {
                existingMarkers.add(Number(markerMatch[1]));
              }
            }

            let createdCount = 0;

            for (const issue of matched) {
              if (existingMarkers.has(issue.number)) {
                core.info(`Skip existing source issue #${issue.number}`);
                continue;
              }

              const originalBody = String(issue.body || '').trim();
              const meta = extractMetaFromBody(originalBody);
              core.info(`Parsed source #${issue.number}: difficulty=${meta.difficulty || 'N/A'}, topics=${meta.topics.join(', ') || 'N/A'}`);

              const body = [
                `Source Issue: ${issue.html_url}`,
                '',
                `Original title: ${issue.title}`,
                '',
                '## Original issue content',
                '',
                originalBody || '_No content_',
                '',
                `<!-- source_repo: ${sourceOwner}/${sourceRepo} -->`,
                `<!-- source_issue: ${issue.number} -->`
              ].join('\n');

              const labels = [];

              const statusTodoLabel = availableLabels.get(normalizeLabelName(statusTodo));
              if (statusTodoLabel) {
                labels.push(statusTodoLabel);
              }

              if (meta.difficulty) {
                const difficultyLabel = availableLabels.get(normalizeLabelName(meta.difficulty));
                if (difficultyLabel) {
                  labels.push(difficultyLabel);
                } else {
                  core.info(`Skip missing label: ${meta.difficulty}`);
                }
              }

              for (const topic of meta.topics) {
                const topicLabel = availableLabels.get(normalizeLabelName(topic));
                if (topicLabel) {
                  labels.push(topicLabel);
                } else {
                  core.info(`Skip missing label: ${topic}`);
                }
              }

              await github.rest.issues.create({
                owner: targetOwner,
                repo: targetRepo,
                title: `[LeetCode] ${issue.title}`,
                body,
                labels: [...new Set(labels)]
              });

              createdCount += 1;
              core.info(`Created issue for source #${issue.number}`);
            }

            core.info(`Done. Created ${createdCount} issue(s).`);
